<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Encurtador de Links</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
        .links-list { margin-top: 30px; }
        .link-item { background: #f4f4f4; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>🔗 Adicionar Novo Link</h2>
    
    <div class="form-group">
        <label>Nome Curto (ex: filme1):</label>
        <input type="text" id="linkName" placeholder="Digite o nome curto">
    </div>
    <div class="form-group">
        <label>URL Original (Link longo):</label>
        <input type="text" id="linkUrl" placeholder="https://...">
    </div>
    <div class="form-group">
        <label>Senha do Admin:</label>
        <input type="password" id="linkPassword" placeholder="Sua senha secreta">
    </div>
    <button onclick="adicionarLink()">Salvar Link</button>

    <div class="links-list">
        <h2>Últimos Links Adicionados</h2>
        <button onclick="carregarLinks()" style="margin-bottom: 15px; background: #28a745;">🔄 Atualizar Lista</button>
        <div id="listaDeLinks"></div>
    </div>

    <script>
        // Função para Adicionar Link
        async function adicionarLink() {
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkUrl').value;
            const password = document.getElementById('linkPassword').value;

            if (!name || !url || !password) {
                alert("Preencha todos os campos!");
                return;
            }

            const response = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Link adicionado com sucesso!");
                carregarLinks(); // Recarrega a lista
            } else {
                alert("Erro: " + data.error);
            }
        }

        // Função para Carregar a Lista de Links
        async function carregarLinks() {
            const response = await fetch('/api/all');
            const links = await response.json();
            const divLista = document.getElementById('listaDeLinks');
            
            divLista.innerHTML = ''; // Limpa a lista atual

            if (links.length === 0) {
                divLista.innerHTML = '<p>Nenhum link cadastrado ainda.</p>';
                return;
            }

            links.forEach(link => {
                const linkEncurtado = window.location.origin + '/' + link.name;
                divLista.innerHTML += `
                    <div class="link-item">
                        <strong>Nome:</strong> ${link.name} <br>
                        <strong>Link Curto:</strong> <a href="${linkEncurtado}" target="_blank">${linkEncurtado}</a> <br>
                        <strong>Destino:</strong> <span style="word-break: break-all; font-size: 0.9em; color: #555;">${link.url}</span>
                    </div>
                `;
            });
        }

        // Carrega a lista automaticamente quando a página abre
        carregarLinks();
    </script>
</body>
</html>
